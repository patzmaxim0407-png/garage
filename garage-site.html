<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Гараж: віддам у добрі руки</title>
<style>
:root{--bg:#faf7f2;--card:#fff;--tx:#2b2620;--mu:#7a7266;--ac:#c8641e;--ac2:#fbe9dc;--bd:#e6dfd3}
@media (prefers-color-scheme:dark){:root{--bg:#1c1915;--card:#27231e;--tx:#f1ebe2;--mu:#a79f92;--ac:#ef8a45;--ac2:#3b2a1d;--bd:#3a342c}}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,sans-serif}
main{max-width:520px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:26px;margin:8px 0 4px}
.sub{color:var(--mu);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:14px}
.card img{width:100%;border-radius:12px;margin-bottom:10px}
.card h2{font-size:19px;margin:0 0 4px}
.card p{margin:0 0 12px;color:var(--mu)}
.btns{display:flex;gap:8px}
.btns a{flex:1;text-align:center;padding:12px 0;font-weight:600;border-radius:12px;border:1px solid var(--ac);background:var(--ac2);color:var(--tx);text-decoration:none}
</style>
</head>
<body>
<main>
<h1>Гараж 🧺</h1>
<p class="sub">Віддаю речі в добрі руки за символічну ціну. Обери суму: хто дасть більше, тому й віддам.</p>
<div id="list"></div>
</main>
<script>
// === НАЛАШТУВАННЯ ===
const TELEGRAM = "your_username";   // ваш нік у Telegram, без @
const PRICES = [50, 75, 120];       // суми на кнопках

// Додавайте речі сюди. photo можна лишити порожнім ("")
const ITEMS = [
  {name: "Стара футболка", desc: "Бавовна, розмір M, носилась, але ще жива.", photo: ""},
  {name: "Приклад: настільна лампа", desc: "Працює, потрібна лише лампочка.", photo: ""}
];
// =====================

const list = document.getElementById("list");
ITEMS.forEach(it => {
  const c = document.createElement("div");
  c.className = "card";
  if (it.photo) {
    const img = document.createElement("img");
    img.src = it.photo; img.alt = it.name;
    c.appendChild(img);
  }
  const h = document.createElement("h2"); h.textContent = it.name;
  const p = document.createElement("p"); p.textContent = it.desc;
  const b = document.createElement("div"); b.className = "btns";
  PRICES.forEach(v => {
    const a = document.createElement("a");
    a.textContent = v + " грн";
    const text = "Привіт! Хочу «" + it.name + "» за " + v + " грн";
    a.href = "https://t.me/" + TELEGRAM + "?text=" + encodeURIComponent(text);
    a.target = "_blank"; a.rel = "noopener";
    b.appendChild(a);
  });
  c.append(h, p, b);
  list.appendChild(c);
});
</script>
</body>
</html>
