<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Гараж: віддай речі в добрі руки</title>
<style>
:root{--or:#E4572E;--cream:#FFF6EA;--ink:#2B2118;--mu:#8a7a6b;--card:#fff;--bd:#f0e2d0;--gr:#2F8F6B}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.45 system-ui,sans-serif}
header{display:flex;align-items:center;gap:8px;padding:12px 16px;position:sticky;top:0;background:var(--cream);border-bottom:1px solid var(--bd);z-index:5}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:22px;cursor:pointer;margin-right:auto}
.logo svg{width:36px;height:36px}
.btn{border:0;border-radius:12px;padding:10px 14px;font:600 15px system-ui;cursor:pointer;background:var(--or);color:#fff}
.btn.alt{background:#fff;color:var(--ink);border:1px solid var(--bd)}
.btn.gr{background:var(--gr)}
main{max-width:900px;margin:0 auto;padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.card img{width:100%;aspect-ratio:4/3;object-fit:cover;background:#f4e8d8}
.card .b{padding:12px;display:flex;flex-direction:column;gap:8px}
.card h3{margin:0;font-size:18px}
.card p{margin:0;color:var(--mu);font-size:14px}
.prices{display:flex;gap:6px}
.prices button{flex:1;padding:10px 0;border-radius:10px;border:1px solid var(--or);background:#fff1ea;color:var(--ink);font:700 15px system-ui;cursor:pointer}
.tag{font-size:12px;color:var(--mu)}
.hero{text-align:center;padding:18px 0 22px}
.hero h1{margin:0 0 6px;font-size:26px}
.hero p{margin:0 0 14px;color:var(--mu)}
form{display:flex;flex-direction:column;gap:12px;max-width:480px;margin:0 auto}
input,textarea{width:100%;padding:12px;border:1px solid var(--bd);border-radius:12px;font:16px system-ui;background:#fff;color:var(--ink)}
.row3{display:flex;gap:8px}
label{font-weight:600;font-size:14px}
.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.tabs .btn{flex:0 0 auto}
.box{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}
.ok{background:#e7f6ef;border:1px solid var(--gr);border-radius:14px;padding:12px;margin-top:6px}
a.tg{display:inline-block;margin-top:6px;color:#fff;background:#229ED9;padding:10px 14px;border-radius:12px;text-decoration:none;font-weight:600}
.empty{text-align:center;color:var(--mu);padding:30px}
.modal{position:fixed;inset:0;background:rgba(43,33,24,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}.modal .box{max-width:400px;width:100%;margin:0}
</style>
</head>
<body>
<header>
  <div class="logo" onclick="go('home')">
    <svg viewBox="0 0 48 48"><path d="M4 22 24 6l20 16v20H4Z" fill="#E4572E"/><path d="M12 34h24M12 39h24" stroke="#FFF6EA" stroke-width="2.5" stroke-linecap="round"/><path d="M24 31l-5.500-5.500C16 22.500 20.500 19.500 24 23.500c3.500-4 8-1 5.500 2Z" fill="#FFF6EA"/></svg>
    Гараж
  </div>
  <button class="btn" onclick="needLogin(()=>go('add'))">Віддати</button>
  <button class="btn alt" id="authBtn" onclick="login()">Увійти</button>
</header>
<main id="app"></main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
// ===== ВСТАВТЕ СВОЇ КЛЮЧІ З FIREBASE =====
const firebaseConfig = {
  apiKey: "AIzaSyAiQAmjnqBN82tIskGDpE7HYaf6R7UNlMA",
  authDomain: "garage-86431.firebaseapp.com",
  projectId: "garage-86431",
  appId: "1:510985201682:web:55e8d8e4642c0a397710cb"
};
// ===== EMAILJS (листи продавцю). Залиште порожнім, якщо поки не налаштовано =====
const EMAILJS = {service: "", template: "", key: ""};
// =========================================
function showErr(m){const d=document.createElement("div");d.style.cssText="background:#fde2e2;color:#a00;padding:10px;font:14px system-ui;position:fixed;bottom:0;left:0;right:0;z-index:99";d.textContent="Помилка: "+m;document.body.appendChild(d);}
window.addEventListener("error",e=>showErr(e.message));
window.addEventListener("unhandledrejection",e=>showErr(e.reason&&e.reason.message||e.reason));
if(firebaseConfig.apiKey.indexOf("ВСТАВТЕ")>-1)showErr("вставте apiKey у файл (рядок apiKey)");
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth(), db = firebase.firestore();
let user = null, items = [], sales = [], buys = [], view = "home", tab = "sales";
const app = document.getElementById("app");
render();

function el(tag, cls, text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e;}
function go(v){view=v;render();window.scrollTo(0,0);}
function login(){return auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e=>{alert("Не вдалося увійти: "+(e.code||e.message));});}
function needLogin(fn){if(user)fn();else login().then(()=>{if(user)fn();});}
function sendMail(p){
  if(!EMAILJS.service)return;
  fetch("https://api.emailjs.com/api/v1.0/email/send",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({service_id:EMAILJS.service,template_id:EMAILJS.template,user_id:EMAILJS.key,template_params:p})}).catch(()=>{});
}

auth.onAuthStateChanged(u=>{
  user=u;
  if(u){
    db.collection("contacts").doc(u.uid).set({email:u.email||""}).catch(()=>{});
    db.collection("requests").where("sellerId","==",u.uid).onSnapshot(s=>{sales=s.docs.map(d=>({id:d.id,...d.data()}));render();});
    db.collection("requests").where("buyerId","==",u.uid).onSnapshot(s=>{buys=s.docs.map(d=>({id:d.id,...d.data()}));render();});
  }else{sales=[];buys=[];}
  render();
});
db.collection("items").orderBy("createdAt","desc").onSnapshot(s=>{items=s.docs.map(d=>({id:d.id,...d.data()}));render();});

function render(){
  const b=document.getElementById("authBtn");
  const n=sales.filter(s=>s.status==="new").length;
  b.textContent=user?("Кабінет"+(n?" ("+n+")":"")):"Увійти";
  b.onclick=()=>{if(user)go("cabinet");else login();};
  app.innerHTML="";
  if(view==="add"&&user)return renderAdd();
  if(view==="cabinet"&&user)return renderCabinet();
  renderHome();
}

function itemCard(it){
  const c=el("div","card");
  if(it.photo){const i=el("img");i.src=it.photo;i.alt=it.title;c.appendChild(i);}
  const b=el("div","b");
  b.append(el("h3","",it.title),el("p","",it.desc||""),el("div","tag","Від: "+it.ownerName));
  const mine=buys.find(x=>x.itemId===it.id);
  if(it.status==="given"){b.appendChild(el("div","tag","✓ Вже віддано"));}
  else if(user&&user.uid===it.ownerId){b.appendChild(el("div","tag","Це ваша річ"));}
  else if(mine){b.appendChild(el("div","ok","Ви обрали "+mine.price+" грн. Продавець напише вам, якщо обере вас."));}
  else{
    const p=el("div","prices");
    it.prices.forEach(v=>{const x=el("button","",v+" грн");x.onclick=()=>needLogin(()=>askContact(it,v));p.appendChild(x);});
    b.appendChild(p);
  }
  c.appendChild(b);return c;
}

function askContact(it,price){
  const m=el("div","modal"),bx=el("div","box");
  bx.appendChild(el("b","","Ви хочете «"+it.title+"» за "+price+" грн"));
  const l=el("label","","Куди вам написати, якщо оберуть саме вас? (Telegram, Viber або WhatsApp: нік чи номер)");
  l.style.cssText="display:block;margin:10px 0 6px";
  const inp=el("input");inp.placeholder="@nick або +380...";
  const row=el("div");row.style.cssText="display:flex;gap:8px;margin-top:10px";
  const ok=el("button","btn","Надіслати"),no=el("button","btn alt","Скасувати");
  no.onclick=()=>m.remove();
  ok.onclick=async()=>{
    const c=inp.value.trim();if(!c){inp.focus();return;}
    ok.disabled=true;ok.textContent="...";
    await db.collection("requests").add({itemId:it.id,itemTitle:it.title,sellerId:it.ownerId,buyerId:user.uid,buyerName:user.displayName||"Покупець",buyerContact:c,price:price,status:"new",createdAt:Date.now()});
    db.collection("contacts").doc(it.ownerId).get().then(d=>{
      if(d.exists&&d.data().email)sendMail({to_email:d.data().email,item_title:it.title,price:price,buyer_name:user.displayName||"Покупець",buyer_contact:c});
    }).catch(()=>{});
    m.remove();
  };
  row.append(ok,no);bx.append(l,inp,row);m.appendChild(bx);document.body.appendChild(m);inp.focus();
}

function renderHome(){
  const h=el("div","hero");
  h.append(el("h1","","Віддай непотрібне. Знайди потрібне."),el("p","","Символічні ціни, добрі руки, жодного сміття."));
  const b=el("button","btn","Віддати річ");b.onclick=()=>needLogin(()=>go("add"));
  h.appendChild(b);app.appendChild(h);
  if(!items.length){app.appendChild(el("div","empty","Поки що тут порожньо. Станьте першим!"));return;}
  const g=el("div","grid");items.forEach(i=>g.appendChild(itemCard(i)));app.appendChild(g);
}

function renderAdd(){
  const f=el("form");
  f.innerHTML='<h2 style="margin:0">Нова річ</h2><label>Назва<input id="t" required maxlength="60"></label><label>Опис<textarea id="d" rows="3" maxlength="300"></textarea></label><label>Три ціни, грн (на вибір покупця)</label><div class="row3"><input id="p1" type="number" min="0" required placeholder="50"><input id="p2" type="number" min="0" required placeholder="75"><input id="p3" type="number" min="0" required placeholder="120"></div><label>Фото<input id="ph" type="file" accept="image/*"></label><button class="btn" id="sv">Опублікувати</button>';
  f.onsubmit=async e=>{
    e.preventDefault();
    const sv=f.querySelector("#sv");sv.disabled=true;sv.textContent="Публікую...";
    let photo="";const file=f.querySelector("#ph").files[0];
    if(file)photo=await shrink(file);
    const prices=[1,2,3].map(k=>Number(f.querySelector("#p"+k).value)).sort((a,b)=>a-b);
    await db.collection("items").add({title:f.querySelector("#t").value.trim(),desc:f.querySelector("#d").value.trim(),prices:prices,photo:photo,ownerId:user.uid,ownerName:user.displayName||"Продавець",status:"open",createdAt:Date.now()});
    go("home");
  };
  app.appendChild(f);
}
function shrink(file){
  return new Promise(res=>{
    const r=new FileReader();
    r.onload=()=>{const im=new Image();im.onload=()=>{
      const s=Math.min(1,700/Math.max(im.width,im.height));
      const c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;
      c.getContext("2d").drawImage(im,0,0,c.width,c.height);
      res(c.toDataURL("image/jpeg",0.7));};im.src=r.result;};
    r.readAsDataURL(file);
  });
}

function contactLinks(c,title,price){
  c=c.trim();if(!c)return[];
  const msg=encodeURIComponent("Привіт! Ви обрані: «"+title+"» за "+price+" грн. Домовимось про оплату та доставку?");
  const digits=c.replace(/[^\d]/g,"");
  if(/^[+\d\s()-]{9,20}$/.test(c)){
    let n=digits;if(n.length===10&&n[0]==="0")n="38"+n;
    return[["Viber","viber://chat?number=%2B"+n],["WhatsApp","https://wa.me/"+n+"?text="+msg],["Telegram","https://t.me/+"+n]];
  }
  const nick=c.replace(/^@/,"").replace(/^https?:\/\/t\.me\//,"").trim();
  return[["Написати в Telegram","https://t.me/"+nick+"?text="+msg]];
}
async function choose(s){
  await db.collection("requests").doc(s.id).update({status:"accepted"});
  await db.collection("items").doc(s.itemId).update({status:"given"});
}

function renderCabinet(){
  const t=el("div","tabs");
  [["sales","Запити на мої речі"],["mine","Мої речі"],["buys","Мої покупки"]].forEach(([k,l])=>{
    const b=el("button","btn"+(tab===k?"":" alt"),l);b.onclick=()=>{tab=k;render();};t.appendChild(b);
  });
  const out=el("button","btn alt","Вийти");out.onclick=()=>{auth.signOut();go("home");};t.appendChild(out);
  app.appendChild(t);
  if(tab==="mine"){
    const mine=items.filter(i=>i.ownerId===user.uid);
    if(!mine.length)app.appendChild(el("div","empty","Ви ще нічого не віддавали."));
    mine.forEach(i=>{
      const bx=el("div","box");
      bx.append(el("b","",i.title),el("div","tag",i.prices.join(" / ")+" грн · "+(i.status==="given"?"віддано":"активна")));
      const r=el("div");r.style.cssText="display:flex;gap:8px;margin-top:8px";
      const g=el("button","btn gr",i.status==="given"?"Повернути в список":"Віддано");
      g.onclick=()=>db.collection("items").doc(i.id).update({status:i.status==="given"?"open":"given"});
      const d=el("button","btn alt","Видалити");
      d.onclick=()=>{if(confirm("Видалити?"))db.collection("items").doc(i.id).delete();};
      r.append(g,d);bx.appendChild(r);app.appendChild(bx);
    });
  }
  if(tab==="sales"){
    if(!sales.length)app.appendChild(el("div","empty","Запитів поки немає."));
    sales.slice().sort((a,b)=>b.createdAt-a.createdAt).forEach(s=>{
      const it=items.find(i=>i.id===s.itemId);
      const bx=el("div","box");
      bx.append(el("b","",s.itemTitle+" — "+s.price+" грн"),el("div","tag","Хоче: "+s.buyerName),el("div","","Контакт: "+(s.buyerContact||"не вказано (запит створено до оновлення)")));
      if(s.status==="accepted"){
        bx.appendChild(el("div","tag","✓ Ви обрали цього покупця. Напишіть йому:"));
        const w=el("div");w.style.cssText="display:flex;gap:8px;flex-wrap:wrap";
        contactLinks(s.buyerContact||"",s.itemTitle,s.price).forEach(([l,h])=>{const a=el("a","tg",l);a.href=h;a.target="_blank";a.rel="noopener";w.appendChild(a);});
        bx.appendChild(w);
      }
      else if(it&&it.status==="given"){bx.appendChild(el("div","tag","Річ уже віддано"));}
      else{const b=el("button","btn gr","Обрати цього покупця");b.style.marginTop="8px";b.onclick=()=>choose(s);bx.appendChild(b);}
      app.appendChild(bx);
    });
  }
  if(tab==="buys"){
    if(!buys.length)app.appendChild(el("div","empty","Ви ще нічого не обирали."));
    buys.forEach(s=>{
      const it=items.find(i=>i.id===s.itemId);
      const bx=el("div","box");
      bx.appendChild(el("b","",s.itemTitle+" — "+s.price+" грн"));
      let st="Очікує вибору продавця";
      if(s.status==="accepted")st="🎉 Вас обрано! Продавець напише вам на "+s.buyerContact;
      else if(it&&it.status==="given")st="Річ віддали іншому";
      bx.appendChild(el("div","tag",st));
      app.appendChild(bx);
    });
  }
}
</script>
</body>
</html>
